spring.application.name=metrics-service
server.port=8081
spring.datasource.url=jdbc:h2:mem:metricsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=metrics-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.deliverylens.project.event,com.deliverylens.metrics.consumer
spring.kafka.consumer.properties.spring.json.value.default.type=com.deliverylens.metrics.consumer.StoryStatusChangedEvent